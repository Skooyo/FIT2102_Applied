name: applied6
version: 0.1.0.0
github: "githubuser/intro"
license: BSD3
author: "Arthur Mahéo, Tim Dwyer, Rhys Newbury and Nick Wang"
maintainer: "tim.dwyer@monash.edu"
copyright: "2019 Arthur Mahéo and Tim Dwyer, 2023 Nick Wang"

extra-source-files:
    - README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/githubuser/intro#readme>

dependencies:
    - base >= 4.7 && < 5
    
default-extensions:
    - InstanceSigs

library:
    source-dirs:
        - src
        - src/supplementary

executables:   
    watch:
        main: Spec.hs
        source-dirs: test
        ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
        dependencies:
            - Glob
            - doctest
            - filepath
            - fsnotify
            - ansi-terminal

tests:
    doctest:
        main: Spec.hs
        source-dirs: test
        ghc-options:
            - -threaded
            - -rtsopts
            - -with-rtsopts=-N
        dependencies:
            - Glob
            - doctest
            - filepath
            - fsnotify
            - ansi-terminal